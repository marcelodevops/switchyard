[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "switchyard"
version = "0.1.0"
description = "Deterministic worker routing and dispatch"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
tools = [
    "mcp>=2.0.0",
]

[project.scripts]
switchyard = "switchyard.cli:main"
eiren-tools = "switchyard.eiren_tools:main"

[tool.hatch.build.targets.wheel]
packages = ["src/switchyard"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
