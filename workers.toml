# Switchyard Real Worker Configuration: Colibrì + AGY + Qoder + Copilot

[[workers]]
name = "qwen-colibri"
kind = "openai-compatible"
capabilities = ["reasoning", "analysis", "summarization", "devops"]
speed = "medium"
cost = "free"
endpoint = "http://macops.local:8000/v1"
model = "qwen3.8-flash-next-colibri"
api_key_env = "COLI_API_KEY"
timeout = 90

[[workers]]
name = "agy"
kind = "agy"
capabilities = ["coding", "debugging", "repo-editing", "reasoning"]
speed = "fast"
cost = "medium"
bin_path = "agy"
effort = "low"
timeout = 60

[[workers]]
name = "qoder"
kind = "qoder"
capabilities = ["coding", "debugging", "refactoring", "reasoning"]
speed = "medium"
cost = "low"
bin_path = "qoder"
model = "Qwen3.8-Flash"
timeout = 60

[[workers]]
name = "copilot"
kind = "copilot"
capabilities = ["coding", "debugging", "repo-editing", "quick-edits"]
speed = "medium"
cost = "medium"
bin_path = "copilot"
timeout = 120
# Copilot runs non-interactively with auto-approved tools in its permitted workspace.
